; Joya bikes lights (warrolight arduino/joyabikes, 2023) adapted to the
; Faceted Badge Rev D: ESP-07S, 4 MB flash (DIO), 13 WS2812B-V6 on GPIO4.
; Flash through J3 with a 3.3 V USB-serial cable: hold BOOT, tap RESET,
; release BOOT, then `pio run -t upload --upload-port <PORT>`.

[platformio]
default_envs = badge

[env:badge]
platform = espressif8266@4.2.1
board = esp07s
framework = arduino
board_build.flash_mode = dio
build_flags = -DFASTLED_ESP8266_RAW_PIN_ORDER
lib_deps =
	fastled/FastLED@3.6.0
	yoursunny/WifiEspNow@0.0.20230713
	ESP8266WiFi
lib_extra_dirs =
	../libraries
upload_speed = 115200
monitor_speed = 9600
