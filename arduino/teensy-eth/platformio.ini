; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
[platformio]
default_envs = teensy41

[env]
lib_deps =
  PaulStoffregen/OctoWS2811@1.5
  fastled/FastLED@3.5.0
  ssilverman/QNEthernet@0.15.0-snapshot
  sstaub/TeensyID@1.3.3
lib_extra_dirs =
  ../libraries

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino

[env:joya-r]
; Joya Uruguay 2026: 300 per output so the totems on outputs 7-8 light their
; full 5 m strips. Ribs stay 258 (server pads to 300). Use setup
; joya-uruguay-300. Back to 258: git checkout dcf75f1 -- this file.
extends = env:teensy41
build_flags =
  -std=gnu++17
  -D LEDS_PER_STRIP=258
  -D UDP_PORT=8888
  -D HOSTNAME=joya-r
; WarroUDP uses std::string_view (C++17) since 24593fd; the Teensy platform
; defaults to an older standard.
build_unflags =
  -std=gnu++14
  -std=gnu++11

[env:joya-h]
extends = env:teensy41
build_flags =
  -D LEDS_PER_STRIP=285
  -D UDP_PORT=8887
  -D HOSTNAME=joya-h

[env:mate]
extends = env:teensy41
build_flags =
  -D LEDS_PER_STRIP=600
  -D UDP_PORT=8886
  -D HOSTNAME=mate
